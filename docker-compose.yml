# ============================================================
# 单卡 RTX 5090（32GB / Blackwell sm_120）运行配置
# 质量档与快速档工作流都跑在这一个实例（端口 8188）；
# 旧 dual（双实例）/split（CFG Split 双卡）模式随 2×4090 方案退役，
# 万一回到多卡机器，从 git 历史找回旧版 compose 即可
# ============================================================

x-image: &comfy-image
  image: ${IMAGE_TAG:-crpi-9pf9lin5vvnxq7uh.cn-hangzhou.personal.cr.aliyuncs.com/ininyumo/vedio_woekflow:v0.34.5-cu130-torch2.12.1}
  build:
    context: .
    args:
      COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.34.5}

services:
  comfyui:
    <<: *comfy-image
    container_name: comfyui-5090
    ports:
      - "8188:8188"
    environment:
      - PORT=8188
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - COMFY_EXTRA_ARGS=${COMFY_EXTRA_ARGS:-}
    volumes:
      - ./models:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./state/comfyui:/opt/ComfyUI/user
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
